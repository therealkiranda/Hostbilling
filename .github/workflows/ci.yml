name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://hostbilling:hostbilling@localhost:5432/hostbilling?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate database schema
        run: pnpm db:validate

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Inspect Prettier output
        run: |
          pnpm exec prettier --write apps/api/src/hosting-plans.ts
          git diff -- apps/api/src/hosting-plans.ts

      - name: Run lint and formatting checks
        run: pnpm check

      - name: Type-check API
        run: pnpm typecheck

      - name: Test API
        run: pnpm test

      - name: Build API
        run: pnpm build
