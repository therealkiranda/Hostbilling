services:
  postgres:
    image: postgres:17-alpine
    container_name: hostbilling-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hostbilling}
      POSTGRES_USER: ${POSTGRES_USER:-hostbilling}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hostbilling}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hostbilling-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-hostbilling} -d ${POSTGRES_DB:-hostbilling}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  hostbilling-postgres-data:
